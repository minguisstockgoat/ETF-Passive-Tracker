<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ETF 리밸런싱 통합본으로 이동</title><link rel="canonical" href="https://minguisstockgoat.github.io/passive-etf-dashboard/"><style>body{font-family:system-ui,sans-serif;max-width:620px;margin:15vh auto;padding:24px;line-height:1.8;background:#f3f7f8;color:#18343e}a{color:#247b7d}</style></head><body><h1>ETF 대시보드를 하나로 통합했습니다.</h1><p>정기변경 일정·비중 제한·일간 구성 변화·기존 관심 ETF 20종을 함께 확인할 수 있습니다.</p><p><a id="go" href="https://minguisstockgoat.github.io/passive-etf-dashboard/daily.html?watch=1">ETF 리밸런싱 통합본 열기 →</a></p><script>
const base='https://minguisstockgoat.github.io/passive-etf-dashboard/';
const etf=location.hash.match(/^#\/etf\/([A-Za-z0-9]{6})$/),manager=location.hash.match(/^#\/manager\/([A-Za-z]+)$/);

</script></body></html>
